<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 150">
  <defs>
    <linearGradient id="faceTopW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E2B8"/>
      <stop offset="100%" stop-color="#D9B876"/>
    </linearGradient>
    <linearGradient id="faceLeftW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4A063"/>
      <stop offset="100%" stop-color="#8C6F3C"/>
    </linearGradient>
    <linearGradient id="faceRightW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A5F35"/>
      <stop offset="100%" stop-color="#4A3B20"/>
    </linearGradient>
    <linearGradient id="stoneGoldW" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4CB93"/>
      <stop offset="45%" stop-color="#BF9D62"/>
      <stop offset="100%" stop-color="#7A5F35"/>
    </linearGradient>
  </defs>

  <!-- faceted gem / cut-stone mark, scaled down -->
  <g transform="translate(10,15) scale(0.72)" stroke="#0D0C0A" stroke-width="2" stroke-linejoin="round">
    <polygon points="80,80 26.3,49 80,18 133.7,49" fill="url(#faceTopW)"/>
    <polygon points="80,80 133.7,49 133.7,111 80,142" fill="url(#faceRightW)"/>
    <polygon points="80,80 80,142 26.3,111 26.3,49" fill="url(#faceLeftW)"/>
  </g>
  <g transform="translate(10,15) scale(0.72)">
    <polygon points="26.3,49 80,18 133.7,49 133.7,111 80,142 26.3,111"
             fill="none" stroke="#F2E2B8" stroke-width="1.4" opacity="0.5"/>
  </g>

  <!-- centered stacked wordmark -->
  <text x="290" y="76" text-anchor="middle"
        font-family="'DM Serif Display', Georgia, 'Times New Roman', serif"
        font-size="42" fill="url(#stoneGoldW)" letter-spacing="0.5">Chesapeake</text>

  <text x="290" y="102" text-anchor="middle"
        font-family="'DM Sans', Arial, Helvetica, sans-serif"
        font-size="15" fill="#A8874A" letter-spacing="4.5">GRANITE AND MARBLE</text>
</svg>
