<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="slabGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBD9A6"/>
      <stop offset="55%" stop-color="#BF9D62"/>
      <stop offset="100%" stop-color="#7A5F35"/>
    </linearGradient>
    <linearGradient id="veinSlab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF1DA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FAF1DA" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#FAF1DA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-7 80 80)">
    <rect x="34" y="24" width="92" height="112" rx="6"
          fill="url(#slabGold)" stroke="#3E3016" stroke-width="2.5"/>
    <path d="M 34 60 C 60 50, 95 72, 126 58" stroke="url(#veinSlab)" stroke-width="2.5" fill="none"/>
    <path d="M 34 95 C 65 105, 90 82, 126 98" stroke="url(#veinSlab)" stroke-width="1.8" fill="none"/>
    <!-- cut edge, giving the slab a hint of thickness -->
    <path d="M 126 24 L 134 32 L 134 144 L 126 136 Z" fill="#5C4A28" stroke="#3E3016" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
